<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Features that exist in one game mode today, and the shared setting each could become."><style>svg{--bg:#f2f4f7;--panel:#ffffff;--ink:#151a22;--muted:#5b6474;--line:#c9d0db;--accent:#1d4fd8;--accent-bg:#e3eaff;--fit:#127a43;--fit-bg:#e2f4ea;--apx:#9a5b00;--apx-bg:#fbefd9;--no:#b4232f;--no-bg:#fbe3e5;--c1:#1d4fd8;--c2:#0f7a8a;--c3:#6b4bc4;--c4:#5b6474;--std:#ffffff;--opt:#f2c230;--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,monospace}
.pn{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.pn-d{fill:var(--panel);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 4}
.pn-a{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.5}
.h{fill:var(--ink);font-family:var(--display);font-weight:600;font-size:19px}
.t{fill:var(--ink);font-family:var(--body);font-size:13.5px}
.tm{fill:var(--muted);font-family:var(--body);font-size:13px}
.tb{fill:var(--ink);font-family:var(--body);font-size:13.5px;font-weight:600}
.c{fill:var(--ink);font-family:var(--mono);font-size:12px}
.cm{fill:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.ca{fill:var(--accent);font-family:var(--mono);font-size:12px;font-weight:600}
.ta{fill:var(--accent);font-family:var(--body);font-size:13.5px;font-weight:600}
.ar{stroke:var(--muted);stroke-width:1.5;fill:none}
.ar-a{stroke:var(--accent);stroke-width:2;fill:none}
.ah{fill:var(--muted)} .ah-a{fill:var(--accent)}
.grid{stroke:var(--line);stroke-width:1}
.fit{fill:var(--fit-bg);stroke:var(--fit);stroke-width:1.2} .fit-t{fill:var(--fit);font-family:var(--mono);font-size:11.5px;font-weight:600}
.no{fill:var(--no-bg);stroke:var(--no);stroke-width:1.2} .no-t{fill:var(--no);font-family:var(--mono);font-size:11.5px;font-weight:600}
.no-z{fill:var(--no-bg)}
.apx{fill:var(--apx-bg);stroke:var(--apx);stroke-width:1.2} .apx-t{fill:var(--apx);font-family:var(--mono);font-size:11.5px;font-weight:600}
.std{fill:var(--std);stroke:var(--ink);stroke-width:1.2} .opt{fill:var(--opt);stroke:var(--ink);stroke-width:1.2}
.s1{fill:var(--c1)} .s2{fill:var(--c2)} .s3{fill:var(--c3)} .s4{fill:var(--c4)}
.st1{stroke:var(--c1)} .st2{stroke:var(--c2)} .st3{stroke:var(--c3)} .st4{stroke:var(--c4)}
.wt{fill:#ffffff;font-family:var(--mono);font-size:11.5px;font-weight:600}
.dot-on{fill:var(--fit)} .dot-off{fill:none;stroke:var(--muted);stroke-width:1.5}
.dot-need{fill:var(--accent-bg);stroke:var(--accent);stroke-width:2}
.dot-part{fill:var(--apx)}
</style><defs><marker id="ah-modes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="ah-modes-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><rect x="0" y="0" width="960" height="330" fill="#f2f4f7"/><text x="20.0" y="30.0" class="cm" text-anchor="start" xml:space="preserve">Feature</text>
<text x="360.0" y="30.0" class="cm" text-anchor="middle" xml:space="preserve">Formula</text>
<text x="470.0" y="30.0" class="cm" text-anchor="middle" xml:space="preserve">Oval</text>
<text x="580.0" y="30.0" class="cm" text-anchor="middle" xml:space="preserve">Endurance</text>
<text x="660.0" y="30.0" class="cm" text-anchor="start" xml:space="preserve">One shared setting</text>
<line x1="20" y1="84" x2="940" y2="84" class="grid"/>
<text x="20.0" y="71.0" class="t" text-anchor="start" xml:space="preserve">Rolling start</text>
<circle cx="360" cy="66" r="8" class="dot-off"/>
<circle cx="470" cy="66" r="8" class="dot-on"/>
<circle cx="580" cy="66" r="8" class="dot-need"/>
<text x="660.0" y="71.0" class="ca" text-anchor="start" xml:space="preserve">start_procedure</text>
<line x1="20" y1="124" x2="940" y2="124" class="grid"/>
<text x="20.0" y="111.0" class="t" text-anchor="start" xml:space="preserve">4 to 6 cars per team</text>
<circle cx="360" cy="106" r="8" class="dot-off"/>
<circle cx="470" cy="106" r="8" class="dot-on"/>
<circle cx="580" cy="106" r="8" class="dot-need"/>
<text x="660.0" y="111.0" class="ca" text-anchor="start" xml:space="preserve">team_entry_cap</text>
<line x1="20" y1="164" x2="940" y2="164" class="grid"/>
<text x="20.0" y="151.0" class="t" text-anchor="start" xml:space="preserve">Grid size as a rule</text>
<circle cx="360" cy="146" r="8" class="dot-part"/>
<circle cx="470" cy="146" r="8" class="dot-on"/>
<circle cx="580" cy="146" r="8" class="dot-need"/>
<text x="660.0" y="151.0" class="ca" text-anchor="start" xml:space="preserve">grid_limit</text>
<line x1="20" y1="204" x2="940" y2="204" class="grid"/>
<text x="20.0" y="191.0" class="t" text-anchor="start" xml:space="preserve">Points for part of a race</text>
<circle cx="360" cy="186" r="8" class="dot-off"/>
<circle cx="470" cy="186" r="8" class="dot-on"/>
<circle cx="580" cy="186" r="8" class="dot-need"/>
<text x="660.0" y="191.0" class="ca" text-anchor="start" xml:space="preserve">stage_racing</text>
<line x1="20" y1="244" x2="940" y2="244" class="grid"/>
<text x="20.0" y="231.0" class="t" text-anchor="start" xml:space="preserve">Playoffs</text>
<circle cx="360" cy="226" r="8" class="dot-off"/>
<circle cx="470" cy="226" r="8" class="dot-on"/>
<circle cx="580" cy="226" r="8" class="dot-off"/>
<text x="660.0" y="231.0" class="ca" text-anchor="start" xml:space="preserve">championship_format</text>
<line x1="20" y1="284" x2="940" y2="284" class="grid"/>
<text x="20.0" y="271.0" class="t" text-anchor="start" xml:space="preserve">Red flags</text>
<circle cx="360" cy="266" r="8" class="dot-on"/>
<circle cx="470" cy="266" r="8" class="dot-off"/>
<circle cx="580" cy="266" r="8" class="dot-need"/>
<text x="660.0" y="271.0" class="ca" text-anchor="start" xml:space="preserve">red_flags</text>
<circle cx="28" cy="304" r="7" class="dot-on"/>
<text x="42.0" y="309.0" class="tm" text-anchor="start" xml:space="preserve">has it today</text>
<circle cx="169.12" cy="304" r="7" class="dot-part"/>
<text x="183.1" y="309.0" class="tm" text-anchor="start" xml:space="preserve">partly (a constant)</text>
<circle cx="357.56" cy="304" r="7" class="dot-off"/>
<text x="371.6" y="309.0" class="tm" text-anchor="start" xml:space="preserve">not today</text>
<circle cx="478.4" cy="304" r="7" class="dot-need"/>
<text x="492.4" y="309.0" class="tm" text-anchor="start" xml:space="preserve">endurance will need it</text></svg>
