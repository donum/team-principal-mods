<text x="420.0" y="326.0" class="c" text-anchor="start" xml:space="preserve">GT3</text>
<text x="343.0" y="346.0" class="cm" text-anchor="start" xml:space="preserve">tags</text>
<text x="420.0" y="346.0" class="c" text-anchor="start" xml:space="preserve">pro_am</text>
<text x="343.0" y="366.0" class="cm" text-anchor="start" xml:space="preserve">rules</text>
<text x="420.0" y="366.0" class="c" text-anchor="start" xml:space="preserve">min drive time each</text>
<text x="343.0" y="386.0" class="cm" text-anchor="start" xml:space="preserve">rounds</text>
<text x="420.0" y="386.0" class="c" text-anchor="start" xml:space="preserve">Le Mans only</text>
<rect x="20.0" y="36.0" width="230.0" height="92.0" rx="6" class="pn"/>
<text x="36.0" y="64.0" class="h" text-anchor="start" xml:space="preserve">Points</text>
<text x="36.0" y="88.0" class="t" text-anchor="start" xml:space="preserve">who scores, which title</text>
<text x="36.0" y="108.0" class="tm" text-anchor="start" xml:space="preserve">guests score nothing</text>
<line x1="323.0" y1="210.0" x2="252.0" y2="82.0" class="ar" marker-end="url(#ah-entry-model)"/>
<rect x="20.0" y="164.0" width="230.0" height="92.0" rx="6" class="pn"/>
<text x="36.0" y="192.0" class="h" text-anchor="start" xml:space="preserve">Qualifying</text>
<text x="36.0" y="216.0" class="t" text-anchor="start" xml:space="preserve">groups and classes</text>
<text x="36.0" y="236.0" class="tm" text-anchor="start" xml:space="preserve">Hyperpole per class</text>
<line x1="323.0" y1="210.0" x2="252.0" y2="210.0" class="ar" marker-end="url(#ah-entry-model)"/>
<rect x="20.0" y="292.0" width="230.0" height="92.0" rx="6" class="pn"/>
<text x="36.0" y="320.0" class="h" text-anchor="start" xml:space="preserve">Balance</text>
<text x="36.0" y="344.0" class="t" text-anchor="start" xml:space="preserve">ballast and BoP</text>
<text x="36.0" y="364.0" class="tm" text-anchor="start" xml:space="preserve">by make or class</text>
<line x1="323.0" y1="210.0" x2="252.0" y2="338.0" class="ar" marker-end="url(#ah-entry-model)"/>
