<rect x="389.0" y="124.0" width="172.0" height="118.0" rx="6" class="pn-a"/>
<text x="403.0" y="152.0" class="h" text-anchor="start" xml:space="preserve">Entry model</text>
<text x="403.0" y="178.0" class="t" text-anchor="start" xml:space="preserve">crews, guests</text>
<text x="403.0" y="198.0" class="t" text-anchor="start" xml:space="preserve">classes, privateers</text>
<text x="403.0" y="218.0" class="t" text-anchor="start" xml:space="preserve">number, code, livery</text>
<rect x="571.0" y="124.0" width="172.0" height="118.0" rx="6" class="pn-a"/>
<text x="585.0" y="152.0" class="h" text-anchor="start" xml:space="preserve">Content as data</text>
<text x="585.0" y="178.0" class="t" text-anchor="start" xml:space="preserve">&quot;Option&quot; tyre, yellow</text>
<text x="585.0" y="198.0" class="t" text-anchor="start" xml:space="preserve">splitter, rear wing</text>
<text x="585.0" y="218.0" class="t" text-anchor="start" xml:space="preserve">supplier physics</text>
<rect x="753.0" y="124.0" width="172.0" height="118.0" rx="6" class="pn-a"/>
<text x="767.0" y="152.0" class="h" text-anchor="start" xml:space="preserve">Dated world</text>
<text x="767.0" y="178.0" class="t" text-anchor="start" xml:space="preserve">Audi -40 kg</text>
<text x="767.0" y="198.0" class="t" text-anchor="start" xml:space="preserve">from week 23</text>
<text x="767.0" y="218.0" class="t" text-anchor="start" xml:space="preserve">rain in October</text>
<line x1="480.0" y1="242.0" x2="480.0" y2="300.0" class="ar" marker-end="url(#ah-big-picture)"/>
<text x="492.0" y="278.0" class="tm" text-anchor="start" xml:space="preserve">read</text>
<text x="25.0" y="296.0" class="cm" text-anchor="start" xml:space="preserve">Pack data, in the format packs use today</text>
<rect x="25.0" y="306.0" width="280.0" height="140.0" rx="6" class="pn"/>
<text x="41.0" y="336.0" class="h" text-anchor="start" xml:space="preserve">regulations.json</text>
<text x="41.0" y="364.0" class="t" text-anchor="start" xml:space="preserve">categories and options</text>
<text x="41.0" y="386.0" class="t" text-anchor="start" xml:space="preserve">voting, scripted_changes</text>
<text x="41.0" y="408.0" class="t" text-anchor="start" xml:space="preserve">an option names a block</text>
<line x1="307.0" y1="376.0" x2="338.0" y2="376.0" class="ar" marker-end="url(#ah-big-picture)"/>
<rect x="340.0" y="306.0" width="280.0" height="140.0" rx="6" class="pn"/>
<text x="356.0" y="336.0" class="h" text-anchor="start" xml:space="preserve">Named blocks (new)</text>
