<line x1="622.0" y1="376.0" x2="653.0" y2="376.0" class="ar" marker-end="url(#ah-big-picture)"/>
<rect x="655.0" y="306.0" width="280.0" height="140.0" rx="6" class="pn"/>
<text x="671.0" y="336.0" class="h" text-anchor="start" xml:space="preserve">Presets</text>
